{% extends 'core/base.html' %}
{% block title %}Add Achievement - TEAM CCA{% endblock %}
{% block content %}
    <div class="card mx-auto" style="max-width: 600px;">
        <div class="card-header">Add Achievement for {{ student.full_name }}</div>
        <div class="card-body">
            {% if messages %}{% for m in messages %}<div class="alert alert-danger">{{ m }}</div>{% endfor %}{% endif %}
            <form method="post">
                {% csrf_token %}
                <div class="mb-3"><label class="form-label">Title</label>
                    <input type="text" name="title" class="form-control" required></div>
                <div class="mb-3"><label class="form-label">Description</label>
                    <textarea name="description" class="form-control" rows="3"></textarea></div>
                <div class="mb-3"><label class="form-label">Date Awarded</label>
                    <input type="date" name="date_awarded" class="form-control" required></div>
                <button type="submit" class="btn btn-accent w-100">Save Achievement</button>
            </form>
        </div>
    </div>
{% endblock %}
