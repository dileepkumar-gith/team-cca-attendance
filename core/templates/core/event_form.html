{% extends 'core/base.html' %}
{% block title %}New Event - TEAM CCA{% endblock %}
{% block content %}
    <div class="card mx-auto" style="max-width: 600px;">
        <div class="card-header">Create Event</div>
        <div class="card-body">
            {% if messages %}{% for m in messages %}<div class="alert alert-danger">{{ m }}</div>{% endfor %}{% endif %}
            <form method="post">
                {% csrf_token %}
                <div class="mb-3"><label class="form-label">Event Name</label>
                    <input type="text" name="name" class="form-control" required></div>
                <div class="mb-3"><label class="form-label">Description</label>
                    <textarea name="description" class="form-control" rows="3"></textarea></div>
                <div class="mb-3"><label class="form-label">Date</label>
                    <input type="date" name="event_date" class="form-control" required></div>
                <div class="mb-3"><label class="form-label">Time</label>
                    <input type="time" name="event_time" class="form-control"></div>
                <div class="mb-3"><label class="form-label">Venue</label>
                    <input type="text" name="venue" class="form-control"></div>
                <div class="mb-3"><label class="form-label">Stream (optional — leave blank for club-wide)</label>
                    <select name="stream" class="form-select">
                        <option value="">-- Club-wide --</option>
                        {% for s in streams %}<option value="{{ s.id }}">{{ s.name }}</option>{% endfor %}
                    </select></div>
                <button type="submit" class="btn btn-accent w-100">Create Event</button>
            </form>
        </div>
    </div>
{% endblock %}
